<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{with .Description}}<meta name="description" content="{{.}}">
{{end}}<title>{{with .Title}}{{.}} – {{end}}{{with .SiteTitle}}{{.}}{{else}}STYRIXA{{end}}</title>
<style>
body{font:17px/1.6 system-ui,sans-serif;margin:0;background:#fafafa;color:#1c1f24}
header,main{max-width:42rem;margin:0 auto;padding:1.5rem}
header{border-bottom:1px solid #e2e4e8}
header a{color:inherit;text-decoration:none;font-weight:700;font-size:1.2rem}
h1{font-size:1.8rem;line-height:1.25}
@media (prefers-color-scheme:dark){body{background:#15171a;color:#e6e8eb}header{border-color:#33373d}a{color:#8ab4ff}}
</style>
</head>
<body>
<header><a href="/">{{with .SiteTitle}}{{.}}{{else}}STYRIXA{{end}}</a></header>
<main>
{{template "content" .}}
</main>
</body>
</html>
